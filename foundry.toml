[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = [
 "solady/=lib/solady/",
 "@uniswap/v4-core/=lib/v4-core/",
 "@uniswap/v4-periphery/=lib/v4-periphery/",
 "permit2/=lib/v4-periphery/lib/permit2/",
 "forge-std/=lib/forge-std/src/",
]
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
